name: 全量更新车站指南数据

# 手动触发：仓库页 Actions → 全量更新车站指南数据 → Run workflow
# 也可每月 1 号 UTC 02:00 自动跑一次。
#
# 加密（2026-11）：具备外部抓取能力的脚本入库即密文（encrypted/*.enc +
# encryption/manifest.tsv），运行时经 prep.sh 先验后写解密、用毕 clean。
# 钥匙来自 Secret: CODE_KEY。workflow YAML 本身无法加密（GitHub 调度限制）。
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: write   # 允许把新生成的 data/ 提交回仓库

concurrency:
  group: eki-info-update
  cancel-in-progress: false   # 全量抓取不中断

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 全量 ~8074 站 × 0.6s ≈ 90 分钟，留 6h 余量
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Step 1/4 校验密文（verify-only，零落盘）
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/4 bash encryption/prep.sh 1

      - name: Step 2/4 物化抓取脚本
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/4 bash encryption/prep.sh 2

      - name: Step 3/4 拉取网站车站主清单
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/4 bash ci/step.sh update 3

      - name: Step 4/4 全量抓取（断点续传；cache 不入库，每次全新抓）
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 4/4 bash ci/step.sh update 4

      # 抓取窗口结束：删除明文脚本（提交只涉及 data/）
      - name: 删除明文抓取脚本
        run: python3 encryption/decrypt.py clean --out .

      - name: 聚合输出
        run: python3 scripts/build.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "data: 全量更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 常开收尾：再清一次（幂等）并断言工作区干净
      - name: 收尾（清理 + 工作区断言）
        if: always()
        run: bash encryption/finalize.sh
